<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamzu Escort</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #ffffff;
            --text-secondary: #8b949e;
            --accent-color: #00bcd4;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 12px 0;
        }

        .counter-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 188, 212, 0.1);
            border: 1px solid rgba(0, 188, 212, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: var(--text-main);
        }

        .counter-dot {
            width: 8px;
            height: 8px;
            background-color: #2ea043;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #2ea043;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            align-self: flex-start;
            margin-bottom: 12px;
            margin-left: 4px;
        }

        .cities-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .city-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .city-card:hover {
            border-color: var(--accent-color);
            background-color: #1f242c;
        }

        .city-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .city-icon {
            color: var(--text-secondary);
            font-size: 18px;
        }

        .city-name {
            font-size: 16px;
            font-weight: 600;
        }

        .arrow {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .footer {
            text-align: center;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .security-text {
            font-size: 11px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .privacy-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .bot-username {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-icon">🪼</div>
        <h1 class="logo-title">LAMZU</h1>
        <div class="counter-badge">
            <div class="counter-dot"></div>
            СЕЙЧАС СВОБОДНЫ: <span id="free-count" style="margin-left: 4px; font-weight: bold;">538</span>
        </div>
    </div>

    <div class="section-title">Выберите город</div>

    <div class="cities-container">
        <div class="city-card" onclick="selectCity('Алматы')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Алматы</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Астана')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Астана</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Дубай')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Дубай</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Екатеринбург')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Екатеринбург</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Казань')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Казань</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Москва')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Москва</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Санкт-Петербург')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Санкт-Петербург</span>
            </div>
            <span class="arrow">›</span>
        </div>

        <div class="city-card" onclick="selectCity('Сочи')">
            <div class="city-info">
                <span class="city-icon">📍</span>
                <span class="city-name">Сочи</span>
            </div>
            <span class="arrow">›</span>
        </div>
    </div>

    <div class="footer">
        <div class="security-text">🛡 Secure & Anonymous</div>
        <div class="privacy-text">18+ | Privacy Policy</div>
        <div class="bot-username">@LamzuEscortBot</div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        function selectCity(cityName) {
            // Здесь будет логика перехода к анкетам выбранного города
            alert("Выбран город: " + cityName);
            // При необходимости можно передать данные обратно в бота через tg.sendData(...)
        }
    </script>
</body>
</html>
